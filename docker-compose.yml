version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: src/SiteSearch.Api/Dockerfile
    container_name: site-search-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: site-search-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
